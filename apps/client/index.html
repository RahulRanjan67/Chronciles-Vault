<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Grimoire — A permanent private home for your entire fiction life. Your fiction life, kept forever." />
    <meta name="theme-color" content="#ffffff" />
    <title>Grimoire — Personal Fiction Sanctum</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      /* Critical Zero-Latency Sanctum Boot Styles (Bright White + Vibrant Prism) */
      html, body {
        margin: 0;
        padding: 0;
        background-color: #f4f7ff;
        color: #0f172a;
        font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-weight: 400;
        overflow-x: hidden;
      }
      .gm-instant-boot {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 35%, rgba(79, 70, 229, 0.14) 0%, rgba(255, 255, 255, 0.96) 55%, #f4f7ff 100%);
        text-align: center;
        padding: 2rem;
      }
      .gm-instant-sigil {
        width: 60px;
        height: 60px;
        border-radius: 20px;
        background: linear-gradient(135deg, #4f46e5, #e11d48);
        box-shadow: 0 12px 32px rgba(79, 70, 229, 0.28);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 1.25rem;
        animation: cvBootPulse 2s infinite ease-in-out;
      }
      @keyframes cvBootPulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.06); }
      }
    </style>
  </head>
  <body class="bg-[var(--gm-bg)] text-[var(--gm-text)] selection:bg-[var(--gm-accent-muted)] font-medium">
    <div id="root">
      <div class="gm-instant-boot" aria-busy="true">
        <div class="gm-instant-sigil">
          <span style="font-size: 26px; color: #ffffff; font-weight: 800;">✦</span>
        </div>
        <div style="font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; color: #4f46e5; margin-bottom: 8px; font-weight: 800;">
          GRIMOIRE · PERSONAL SANCTUM
        </div>
        <div style="font-size: 28px; font-weight: 800; letter-spacing: -0.02em; color: #0f172a;">
          Preparing Your Sanctum…
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
