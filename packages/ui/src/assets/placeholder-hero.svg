<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" fill="none">
  <defs>
    <radialGradient id="cv-hero-glow1" cx="30%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#312e81" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cv-hero-glow2" cx="75%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.25" />
      <stop offset="80%" stop-color="#1e1b4b" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cv-line-grad" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Deep canvas background -->
  <rect width="1200" height="480" fill="#09090b" />
  <rect width="1200" height="480" fill="url(#cv-hero-glow1)" />
  <rect width="1200" height="480" fill="url(#cv-hero-glow2)" />

  <!-- Subtle editorial grid overlay -->
  <g opacity="0.12" stroke="#ffffff" stroke-width="0.5">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="200" y1="0" x2="200" y2="480" />
    <line x1="400" y1="0" x2="400" y2="480" />
    <line x1="600" y1="0" x2="600" y2="480" />
    <line x1="800" y1="0" x2="800" y2="480" />
    <line x1="1000" y1="0" x2="1000" y2="480" />
  </g>

  <!-- Isometric / Editorial continuity curves -->
  <path d="M-100 360 C 300 360, 400 140, 750 200 C 1000 240, 1150 120, 1300 160" stroke="url(#cv-line-grad)" stroke-width="2" />
  <path d="M-50 420 C 350 400, 450 220, 850 260 C 1050 280, 1180 200, 1300 220" stroke="url(#cv-line-grad)" stroke-width="1.5" stroke-dasharray="6 6" />

  <!-- Accent star marker -->
  <circle cx="750" cy="200" r="4" fill="#818cf8" />
  <circle cx="750" cy="200" r="12" stroke="#818cf8" stroke-opacity="0.3" stroke-width="1.5" />
</svg>
